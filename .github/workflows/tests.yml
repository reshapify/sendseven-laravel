name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }} (${{ matrix.stability }})

    steps:
      - uses: actions/checkout@v7

      # Until reshapify/sendseven is on Packagist, composer.json path-requires it from ../sendseven-php.
      - uses: actions/checkout@v7
        with:
          repository: reshapify/sendseven-php
          path: sendseven-php

      - name: Place the core SDK next to this package
        run: mv sendseven-php ../sendseven-php

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest --ci

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Static analysis and style

    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: reshapify/sendseven-php
          path: sendseven-php

      - name: Place the core SDK next to this package
        run: mv sendseven-php ../sendseven-php

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Pint
        run: composer test:lint

      - name: Rector
        run: composer test:refactor

      - name: PHPStan
        run: composer test:types

      - name: Type coverage
        run: composer test:type-coverage
